# XcodeGen spec for LisaApp -- the M1c app shell (SwiftUI window + menus
# driving `LisaShell.EmulationController`). This file is the committed
# source of truth; the generated `LisaApp.xcodeproj` is GITIGNORED and
# regenerated on demand:
#
#   xcodegen generate --spec LisaApp/project.yml
#
# See docs/superpowers/plans/2026-08-05-m1c-app-shell.md's Global
# Constraints ("Xcode project convention") for why: keeps the repo's only
# generated, machine-specific project file out of version control while
# still giving every contributor/agent an identical, reproducible project.
name: LisaApp

options:
  bundleIdPrefix: com.lisaemu
  deploymentTarget:
    macOS: "14.0"

# Local Swift package dependency on the repo root package (one level up
# from this file, LisaApp/project.yml -> ../Package.swift) -- LisaApp
# links LisaShell's product only; LisaShell in turn depends on LisaCore
# (see root Package.swift), so both come along transitively.
packages:
  LisaEmu:
    path: ..

targets:
  LisaApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    dependencies:
      - package: LisaEmu
        product: LisaShell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisaemu.LisaApp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Sandbox intentionally OFF (no entitlements file at all -- an
        # Xcode target without CODE_SIGN_ENTITLEMENTS is unsandboxed by
        # default): LisaApp is a local dev tool that reads ROM files
        # directly from `LISAEMU_ROM_DIR`/`~/Development/LisaROMs`, a
        # location outside any app container. App Store distribution
        # (which would require the sandbox) is an explicit non-goal for
        # this project -- see the plan's Global Constraints.
    info:
      path: Info.plist
      properties:
        CFBundleName: LisaApp
        CFBundleDisplayName: LisaEmu
        CFBundleIdentifier: com.lisaemu.LisaApp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "No Apple ROMs, disk images, or Lisa source are included or accepted in this project."
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true

  # Unit tests for InputCapture's pure logic (CaptureState, isReservedMenu
  # Shortcut) -- code-review fix round, M1c Task 4: these two bugs
  # (Caps Lock defeating menu-shortcut recognition, capture-release leaving
  # the emulated mouse button stuck down) were found by hand-review, not by
  # a test, precisely because there was no automated coverage of
  # InputCapture's logic before this. Hosted by LisaApp (TEST_HOST/
  # BUNDLE_LOADER) -- the standard Xcode pattern for `@testable import`-ing
  # an application target's internal symbols, which a plain unhosted bundle
  # can't link against (app targets don't export a symbol table the way
  # frameworks do).
  LisaAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/LisaAppTests
    dependencies:
      - target: LisaApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LisaApp.app/Contents/MacOS/LisaApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LisaApp:
    build:
      targets:
        LisaApp: all
        LisaAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LisaAppTests
    archive:
      config: Release
